<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 800px; height: 800px; overflow: hidden; background: #f5f2eb; }
body {
  font-family: 'DM Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 640px;
  background: #ffffff;
  border: 1px solid #d4cfc4;
  border-radius: 4px;
  padding: 52px 56px 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  box-shadow: 0 4px 32px rgba(0,0,0,0.06);
}

/* Top gold accent */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #c8a84b, rgba(200,168,75,0.3));
  border-radius: 4px 4px 0 0;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: #0d0d0d;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.logo span { color: #3d7a72; }

.tagline {
  font-size: 11px;
  color: #7a7060;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 36px;
}

.qr-wrap {
  background: #fff;
  padding: 16px;
  border: 1px solid #e8e4dc;
  border-radius: 2px;
  margin-bottom: 32px;
}

canvas {
  display: block;
}

.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin-bottom: 24px;
}
.divider-line { flex: 1; height: 1px; background: #d4cfc4; }
.divider-text { font-size: 10px; color: #b0a898; letter-spacing: 0.12em; text-transform: uppercase; }

.url {
  font-size: 13px;
  color: #3d7a72;
  letter-spacing: 0.02em;
  margin-bottom: 28px;
}

.badges {
  display: flex;
  gap: 12px;
}
.badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f5f2eb;
  border: 1px solid #d4cfc4;
  padding: 8px 16px;
  border-radius: 2px;
  font-size: 11px;
  color: #7a7060;
  letter-spacing: 0.04em;
}
.badge svg { flex-shrink: 0; opacity: 0.6; }

.footer-note {
  margin-top: 32px;
  font-size: 10px;
  color: #b0a898;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Fin<span>mate</span></div>
  <div class="tagline">Personal Finance · Free · iOS &amp; Android</div>

  <div class="qr-wrap">
    <img src="qr-code.png" width="280" height="280" alt="QR Code">
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text">or visit</div>
    <div class="divider-line"></div>
  </div>

  <div class="url">get-finmate.netlify.app</div>

  <div class="badges">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#0d0d0d"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      App Store
    </div>
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#0d0d0d"><path d="M3.18 23.76c.3.17.64.24.99.19l13.12-7.57-2.79-2.79-11.32 10.17zm-1.67-20.5C1.19 3.6 1 4.03 1 4.56v14.88c0 .53.19.96.51 1.28l.07.06 8.34-8.34v-.2L1.58 3.2l-.07.06zm18.12 8.58-2.82-1.63-3.12 3.12 3.12 3.12 2.85-1.65c.81-.47.81-1.24-.03-1.96zM4.17.24L17.29 7.81l-2.79 2.79L3.18.43A1.28 1.28 0 0 1 4.17.24z"/></svg>
      Google Play
    </div>
  </div>

  <div class="footer-note">Scan to download · Free forever</div>
</div>


</body>
</html>
